<script type="application/shiny-prerendered" data-context="server">
output$output_plot <- shiny::renderPlot({
  depth_bin <- c("< 5m","5-25m","25-60m",
                          "60-270m","270-400m","400-800m",
                          "800-1200m","1200-2000m","2000-3000m")
  tax_simplified_list <- c("TSAR-Telonemia_X","TSAR-Stramenopiles_X","TSAR-Radiolaria","TSAR-Perkinseagrey","TSAR-NA","TSAR-Gyrista","TSAR-Dinoflagellata","TSAR-Ciliophora","TSAR-Chrompodellids","TSAR-Cercozoa","TSAR-Bigyra","TSAR-Apicomplexa","TSAR-Alveolata_X","Provora","Obazoa-Opisthokonta_X","Obazoa-Metazoa","Obazoa-Ichthyosporea","Obazoa-Fungi","Obazoa-Choanoflagellata","Obazoa-Apusomonada_X","Haptista","Excavata","Eukaryota_X","Cryptista","Archaeplastida","Amoebozoa")
  tax_color  <- c("#607080","#2f97f7","#2c5c1d","#6da65b", "grey20","#de6600", #Gyrista
                  "#ee429b", #dinos
                  "#1abc9c", # ciliates
                  "#23b521","#f5bfb0","#fea02f", "#f7d472",
                  "#d7b6d7","#460e57",
                  "#572f0e","#916643","#c95e06", "#dba272", "#e6d2b8", "#b09b10",
                  "#ad3d46", #Haptista
                  "#5e0810", "grey30", "#db9399","#93c47d","#ca7ade")
  names(tax_color) <- tax_simplified_list
  # Data import
  read.csv("dashboard-data/supergroup_relabun.csv") %>% 
    mutate(depth_bin_order = factor(DEPTH_BIN, levels = rev(depth_bin)),
          tax_order = factor(Supergroup_simplified, levels = rev(tax_simplified_list))) |> 
    filter(Supergroup_simplified %in% input$select_supergroups,
      Station >= input$Station) %>% 
    # ) %>% 
    # filter(Station == 1) %>% 
  ggplot(aes(y = depth_bin_order, x = SUM_SEQ, fill = tax_order)) +
  geom_bar(stat = "identity", position = "fill", color = "black", width = 0.9) +
  scale_fill_manual(values = tax_color) +
  scale_x_continuous(expand = c(0,0)) +
  facet_grid(rows = vars(Station), scales = "free_y", space = "free", axis.labels = "all_x") +
  theme_classic() + theme(
    legend.position = "right",
    legend.title = element_blank(),
    legend.text = element_text(color = "black", face = "bold"),
    strip.background = element_blank(),
    strip.text.y = element_text(angle = 0, color = "black", face = "bold"),
    axis.title = element_text(color = "black", face = "bold"),
    axis.text.y = element_text(color = "black", face = "bold"),
    axis.text.x = element_text(color = "black", face = "bold")) +
  guides(fill = guide_legend(reverse = TRUE, ncol = 1)) +
  labs(x = "Sequence Relative Abundace", y = "Depth (m)")
})
</script>
 
<script type="application/shiny-prerendered" data-context="server-extras">
ojs_define <- function(..., .session = shiny::getDefaultReactiveDomain()) {
  quos <- rlang::enquos(...)
  vars <- rlang::list2(...)
  nm <- names(vars)
  if (is.null(nm)) {
    nm <- rep_len("", length(vars))
  }
  mapply(
    function(q, nm, val) {
      # Infer name, if possible
      if (nm == "") {
        tryCatch(
          {
            nm <- rlang::as_name(q)
          },
          error = function(e) {
            code <- paste(collapse = "\n", deparse(rlang::f_rhs(q)))
            stop(
              "ojs_define() could not create a name for the argument: ",
              code
            )
          }
        )
      }
      .session$output[[nm]] <- val
      outputOptions(.session$output, nm, suspendWhenHidden = FALSE)
      .session$sendCustomMessage("ojs-export", list(name = nm))
      NULL
    },
    quos,
    nm,
    vars,
    SIMPLIFY = FALSE,
    USE.NAMES = FALSE
  )
  invisible()
}

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
